    // Fungsi format tarikh (Contoh: 2026-07-30T... kepada 30-07-2026)
    function formatTarikh(dateString) {
        if (!dateString) return '-';
        let date = new Date(dateString);
        if (isNaN(date.getTime())) return dateString; 
        
        let hari = String(date.getDate()).padStart(2, '0');
        let bulan = String(date.getMonth() + 1).padStart(2, '0');
        let tahun = date.getFullYear();
        
        return `${hari}-${bulan}-${tahun}`;
    }

    // Fungsi muat data permohonan dari Google Sheet (Gantikan URL Web App anda)
    function loadSheetData() {
        const WEB_APP_URL = 'MASUKKAN_URL_WEB_APP_ANDA_DI_SINI';

        fetch(WEB_APP_URL)
            .then(response => response.json())
            .then(data => {
                let tableHTML = '';
                if (data.length === 0) {
                    document.getElementById('dataTableBody').innerHTML = `<tr><td colspan="8" class="text-center p-4">Tiada rekod permohonan.</td></tr>`;
                    return;
                }

                data.forEach(item => {
                    tableHTML += `
                        <tr class="border-b">
                            <td class="border p-2">${formatTarikh(item.tarikhPulang)}</td>
                            <td class="border p-2 font-bold">${item.namaPelajar}<br><span class="text-xs text-gray-500">ID: ${item.idPelajar}</span></td>
                            <td class="border p-2">${item.kelas}</td>
                            <td class="border p-2">${item.sebab}</td>
                            <td class="border p-2">${formatTarikh(item.tarikhBalik)}</td>
                            <td class="border p-2">${item.noTelefonPemohon || '-'}</td>
                            <td class="border p-2 font-semibold ${item.status === 'Diluluskan' ? 'text-green-600' : (item.status === 'Ditolak' ? 'text-red-600' : 'text-orange-500')}">${item.status}</td>
                            <td class="border p-2 text-center">
                                <!-- Butang Tindakan Warden -->
                                <button onclick="updateStatus(${item.rowIndex}, 'Diluluskan')" class="bg-green-600 text-white px-2 py-1 rounded text-sm mb-1">Lulus</button>
                                <button onclick="updateStatus(${item.rowIndex}, 'Ditolak')" class="bg-red-700 text-white px-2 py-1 rounded text-sm">Tolak</button>
                            </td>
                        </tr>
                    `;
                });
                document.getElementById('dataTableBody').innerHTML = tableHTML;
            })
            .catch(error => {
                console.error('Ralat memuatkan data:', error);
                document.getElementById('dataTableBody').innerHTML = `<tr><td colspan="8" class="text-center p-4 text-red-500">Gagal memuatkan data dari Google Sheet.</td></tr>`;
            });
    }

    // Fungsi kemas kini status oleh warden
    function updateStatus(rowIndex, status) {
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzaOiZGzdmTneaayNwvGJfV0vB4Z2ZDSKx8h2A1Kd-GpV7Jw4RTM1U3_lMz_lH8dD00/exec';
        
        fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'updateStatus', rowIndex: rowIndex, status: status })
        })
        .then(response => response.json())
        .then(res => {
            if (res.result === 'success') {
                loadSheetData(); // Muat semula jadual selepas kemas kini
            } else {
                alert('Gagal mengemas kini status.');
            }
        })
        .catch(err => console.error('Ralat:', err));
    }
