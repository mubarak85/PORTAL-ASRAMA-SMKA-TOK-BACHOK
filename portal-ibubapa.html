<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Asrama - Permohonan Pulang Bermalam</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); margin: 0; padding: 20px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { max-width: 550px; width: 100%; background: #ffffff; padding: 35px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); box-sizing: border-box; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: #3498db; text-decoration: none; font-weight: 600; font-size: 14px; }
        .back-btn:hover { color: #2980b9; text-decoration: underline; }
        h2 { color: #2c3e50; text-align: center; margin-top: 0; margin-bottom: 25px; font-size: 24px; border-bottom: 2px solid #f0f0f0; padding-bottom: 15px; }
        .form-group { margin-bottom: 20px; position: relative; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #34495e; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #dcdde1; border-radius: 6px; box-sizing: border-box; font-size: 14px; background-color: #fdfdfd; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #3498db; box-shadow: 0 0 5px rgba(52, 152, 219, 0.3); background-color: #fff; }
        input:readonly { background-color: #eaeded; color: #555; cursor: not-allowed; }
        button { background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); color: white; padding: 14px; border: none; border-radius: 6px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3); }
        button:hover { opacity: 0.9; }
        button:disabled { background: #bdc3c7; box-shadow: none; cursor: not-allowed; }
        .alert { padding: 15px; margin-bottom: 20px; border-radius: 6px; font-size: 14px; display: none; }
        .alert-success { background-color: #e8f8f5; color: #27ae60; border: 1px solid #a3e4d7; }
        .alert-error { background-color: #ffd2d2; color: #c0392b; border: 1px solid #f5b7b1; }
        .receipt-box { background: #f9f9f9; border: 1px dashed #27ae60; padding: 15px; border-radius: 6px; margin-top: 15px; text-align: left; font-size: 13px; color: #333; }
        .action-btn { background: #27ae60; color: white; padding: 10px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; display: inline-block; text-decoration: none; text-align: center; flex: 1; }
        .action-btn:hover { opacity: 0.9; }
        
        /* Senarai Autocomplete */
        .autocomplete-items { position: absolute; border: 1px solid #dcdde1; border-bottom: none; border-top: none; z-index: 99; top: 100%; left: 0; right: 0; max-height: 200px; overflow-y: auto; background-color: #fff; border-radius: 0 0 6px 6px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .autocomplete-items div { padding: 12px; cursor: pointer; border-bottom: 1px solid #dcdde1; font-size: 14px; color: #333; }
        .autocomplete-items div:hover { background-color: #e8f4f8; color: #2980b9; font-weight: bold; }

        @media print {
            .no-print { display: none; }
            body { background: white; padding: 0; }
            .container { box-shadow: none; padding: 0; max-width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-btn no-print">&larr; Kembali ke Menu Utama</a>
    <h2>Permohonan Keluar / Pulang Bermalam</h2>
    
    <div id="alertBox" class="alert"></div>

    <form id="leaveForm" class="no-print">
        <div class="form-group">
            <label for="searchNama">Cari Nama Pelajar:</label>
            <input type="text" id="searchNama" autocomplete="off" placeholder="Sedang memuat turun senarai pelajar..." disabled required>
            <div id="autocompleteList" class="autocomplete-items"></div>
            <small id="searchHelp" style="color: #7f8c8d; font-size: 12px;">Sila tunggu sebentar, sedang memuat data...</small>
        </div>

        <div class="form-group" style="display:none;">
            <label for="idPelajar">No. ID Pelajar:</label>
            <input type="text" id="idPelajar" readonly>
        </div>

        <div class="form-group">
            <label for="namaPelajar">Nama Penuh Pelajar:</label>
            <input type="text" id="namaPelajar" readonly required placeholder="Dipilih automatik daripada carian">
        </div>
        
        <div class="form-group">
            <label for="kelas">Maklumat Kelas & Dorm:</label>
            <input type="text" id="kelas" readonly required placeholder="Dipilih automatik daripada carian">
        </div>

        <div class="form-group">
            <label for="sebab">Sebab Keluar / Pulang:</label>
            <textarea id="sebab" rows="3" required placeholder="Cth: Pulang bermalam cuti hujung minggu"></textarea>
        </div>
        <div class="form-group">
            <label for="tarikhPulang">Tarikh Keluar Asrama:</label>
            <input type="date" id="tarikhPulang" required>
        </div>
        <div class="form-group">
            <label for="tarikhBalik">Tarikh Kembali ke Asrama:</label>
            <input type="date" id="tarikhBalik" required>
        </div>
        <button type="submit" id="submitBtn" disabled style="background: #bdc3c7;">Hantar Permohonan (Sila Pilih Nama Pelajar Dulu)</button>
    </form>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzaOiZGzdmTneaayNwvGJfV0vB4Z2ZDSKx8h2A1Kd-GpV7Jw4RTM1U3_lMz_lH8dD00/exec';
    
    // Nombor WhatsApp Warden (60132429642)
    const nomorWardenWhatsApp = '60132429642'; 

    let studentList = [];

    const searchInput = document.getElementById('searchNama');
    const searchHelp = document.getElementById('searchHelp');
    const listContainer = document.getElementById('autocompleteList');
    const submitBtn = document.getElementById('submitBtn');

    const todayStr = new Date().toISOString().split('T')[0];
    document.getElementById('tarikhPulang').min = todayStr;

    async function fetchStudents() {
        try {
            const res = await fetch(`${scriptURL}?action=getStudents`);
            studentList = await res.json();
            searchInput.disabled = false;
            searchInput.placeholder = "Taip sebahagian nama pelajar di sini...";
            searchHelp.textContent = "Taip nama dan klik pada senarai yang muncul di bawah.";
        } catch(err) {
            console.error('Gagal memuatkan senarai pelajar:', err);
            searchHelp.textContent = "Gagal memuat senarai pelajar. Sila segar semula (refresh) halaman.";
            searchHelp.style.color = "#c0392b";
        }
    }
    fetchStudents();

    searchInput.addEventListener('input', function() {
        const val = this.value.trim().toLowerCase();
        listContainer.innerHTML = '';
        
        if (!val) {
            document.getElementById('idPelajar').value = '';
            document.getElementById('namaPelajar').value = '';
            document.getElementById('kelas').value = '';
            submitBtn.disabled = true;
            submitBtn.style.background = '#bdc3c7';
            submitBtn.textContent = 'Hantar Permohonan (Sila Pilih Nama Pelajar Dulu)';
            return;
        }

        const matches = studentList.filter(s => s.nama && s.nama.toLowerCase().includes(val));

        matches.forEach(student => {
            const item = document.createElement('div');
            item.innerHTML = `<b>${student.nama}</b> <span style="color:#7f8c8d; font-size:12px;">(Ting: ${student.tingkatan || '-'} | Kelas: ${student.namaKelas || '-'} | Dorm: ${student.dorm || '-'})</span>`;
            
            item.addEventListener('click', function() {
                searchInput.value = student.nama;
                document.getElementById('idPelajar').value = student.id || '-';
                document.getElementById('namaPelajar').value = student.nama;
                document.getElementById('kelas').value = `Tingkatan: ${student.tingkatan || '-'} | Kelas: ${student.namaKelas || '-'} | Dorm: ${student.dorm || '-'}`;
                
                listContainer.innerHTML = '';
                
                submitBtn.disabled = false;
                submitBtn.style.background = 'linear-gradient(135deg, #3498db 0%, #2980b9 100%)';
                submitBtn.textContent = 'Hantar Permohonan';
            });
            listContainer.appendChild(item);
        });
    });

    document.getElementById('tarikhPulang').addEventListener('change', function() {
        const tKeluar = this.value;
        const tarikhBalikInput = document.getElementById('tarikhBalik');
        tarikhBalikInput.min = tKeluar;
        if (tarikhBalikInput.value && tarikhBalikInput.value < tKeluar) {
            tarikhBalikInput.value = '';
        }
    });

    document.addEventListener('click', function (e) {
        if (e.target !== searchInput) {
            listContainer.innerHTML = '';
        }
    });

    const form = document.getElementById('leaveForm');
    const alertBox = document.getElementById('alertBox');

    form.addEventListener('submit', e => {
        e.preventDefault();
        
        const tKeluar = document.getElementById('tarikhPulang').value;
        const tBalik = document.getElementById('tarikhBalik').value;
        const sebabVal = document.getElementById('sebab').value;

        if (tBalik < tKeluar) {
            showAlert('Tarikh kembali tidak boleh lebih awal dari tarikh keluar.', 'error');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = 'Sedang menghantar...';
        alertBox.style.display = 'none';

        const randomNum = Math.floor(1000 + Math.random() * 9000);
        const dateStringId = new Date().toISOString().slice(0,10).replace(/-/g,'');
        const refNo = `AST-${dateStringId}-${randomNum}`;

        const formData = {
            refNo: refNo,
            idPelajar: document.getElementById('idPelajar').value,
            namaPelajar: document.getElementById('namaPelajar').value,
            kelas: document.getElementById('kelas').value,
            sebab: sebabVal,
            tarikhPulang: tKeluar,
            tarikhBalik: tBalik
        };

        fetch(scriptURL, { method: 'POST', body: JSON.stringify(formData) })
        .then(response => response.json())
        .then(data => {
            if(data.result === 'success') {
                form.style.display = 'none';
                alertBox.className = 'alert alert-success';

                // Teks Mesej WhatsApp
                const textWhatsApp = `*PERMOHONAN PULANG BERMALAM*\n\n` +
                                     `*No. Rujukan:* ${refNo}\n` +
                                     `*Nama:* ${formData.namaPelajar}\n` +
                                     `*Maklumat:* ${formData.kelas}\n` +
                                     `*Sebab:* ${sebabVal}\n` +
                                     `*Tarikh Keluar:* ${tKeluar}\n` +
                                     `*Tarikh Balik:* ${tBalik}\n` +
                                     `*Status:* Menunggu Kelulusan Warden`;
                
                const encodedText = encodeURIComponent(textWhatsApp);
                const whatsappLink = `https://wa.me/${nomorWardenWhatsApp}?text=${encodedText}`;

                alertBox.innerHTML = `
                    <b>Permohonan Berjaya Dihantar!</b>
                    <div id="printableReceipt" class="receipt-box">
                        <p style="margin: 0 0 5px 0; font-weight: bold; text-align: center; color: #2c3e50;">RESIT PERMOHONAN PULANG BERMALAM</p>
                        <hr style="border: 0; border-top: 1px solid #ddd; margin: 5px 0;">
                        <b>No. Rujukan:</b> <span style="color: #2980b9;">${refNo}</span><br>
                        <b>No. ID Pelajar:</b> ${formData.idPelajar}<br>
                        <b>Nama Pelajar:</b> ${formData.namaPelajar}<br>
                        <b>Maklumat:</b> ${formData.kelas}<br>
                        <b>Tarikh Keluar:</b> ${tKeluar}<br>
                        <b>Tarikh Balik:</b> ${tBalik}<br>
                        <b>Status:</b> Menunggu Kelulusan Warden
                    </div>
                    <div style="margin-top: 15px; display: flex; flex-direction: column; gap: 8px;" class="no-print">
                        <div style="display: flex; gap: 8px;">
                            <a href="${whatsappLink}" target="_blank" class="action-btn" style="background: #25D366; text-align: center;">💬 Hantar ke WhatsApp Warden</a>
                            <button class="action-btn" onclick="window.print()" style="background: #27ae60;">🖨️ Cetak Bukti</button>
                        </div>
                        <a href="semak-status.html" class="action-btn" style="background:#3498db; text-align: center;">🔍 Semak Status</a>
                    </div>
                `;
                alertBox.style.display = 'block';
            } else {
                showAlert('Ralat sistem: ' + data.message, 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Hantar Permohonan';
            }
        })
        .catch(error => {
            showAlert('Gagal berhubung dengan pelayan. Sila cuba lagi.', 'error');
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Hantar Permohonan';
        });
    });

    function showAlert(message, type) {
        alertBox.textContent = message;
        alertBox.className = 'alert ' + (type === 'success' ? 'alert-success' : 'alert-error');
        alertBox.style.display = 'block';
    }
</script>

</body>
</html>
